services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: async-dataset-profiling-service-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: async-dataset-profiling-service-worker
    command: ["python", "-m", "app.worker.main"]
    env_file:
      - .env
    healthcheck:
      disable: true
    restart: unless-stopped
